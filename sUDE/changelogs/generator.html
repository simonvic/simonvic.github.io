<!DOCTYPE html>
<html>

<head>
	<title>sUDE | Changelogs</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/sUDE/css/style.css">
	<script src="https://unpkg.com/semver-ts/dist/index.global.js"></script>
	<script src="https://unpkg.com/turndown/dist/turndown.js"></script>
	<script
		src="https://cdnjs.cloudflare.com/ajax/libs/he/1.2.0/he.min.js"
		integrity="sha512-PEsccDx9jqX6Dh4wZDCnWMaIO3gAaU0j46W//sSqQhUQxky6/eHZyeB3NrXD2xsyugAKd4KPiDANkcuoEa2JuA=="
		crossorigin="anonymous"
		referrerpolicy="no-referrer">
		</script>
	<script src="/sUDE/js/highlight.js"></script>
	<script src="/sUDE/js/main.js"></script>
	<script src="js/changelogs.js"></script>
	<script src="js/generator.js"></script>
</head>

<body>
	<header>
		<nav aria-label="breadcrumb">
			<a href="/">Home</a>
			<a href="/sUDE">sUDE</a>
			<a href="/sUDE/changelogs">Changelogs</a>
			<a href="" aria-current="page">Generator</a>
		</nav>
	</header>
	<main>
		<section id="output"></section>
		<script>
			fetchChangelogs().then(result => {
				let html = ""
				for (const changelog of result.flatChangelogs.toReversed()) {
					html += generate(changelog);
				}
				document.getElementById("output").innerHTML += html;
			});

		</script>
	</main>
</body>

</html>
