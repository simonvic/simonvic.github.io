<!DOCTYPE html>
<html>

<head>
	<title>sUDE | Changelogs</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/sUDE/css/style.css">
	<script src="https://unpkg.com/semver-ts/dist/index.global.js"></script>
	<script src="/sUDE/js/main.js"></script>
	<script src="js/changelogs.js"></script>
</head>

<body>
	<header>
		<nav aria-label="breadcrumb">
			<a href="/">Home</a>
			<a href="/sUDE">sUDE</a>
			<a href="" aria-current="page">Changelogs</a>
		</nav>
	</header>
	<main>
		<section>
			<fieldset onchange="applyFiltersChangelogs()">
				<legend>Filters</legend>
				<label>
					By mods
					<details id="filter_mods" role="list">
						<summary aria-haspopup="listbox">Mods</summary>
						<menu>
							<li>
								<label>
									<input type="checkbox" value="sFramework" checked>
									sFramework
								</label>
							</li>
							<li>
								<label>
									<input type="checkbox" value="sVisual" checked>
									sVisual
								</label>
							</li>
							<li>
								<label>
									<input type="checkbox" value="sGunplay" checked>
									sGunplay
								</label>
							</li>
						</menu>
					</details>
				</label>
				<br />
				<label for="filter_date">
					Show after
					<input id="filter_date" type="date">
				</label>
				<br />
				<label for="filter_show_experimental">
					<input id="filter_show_experimental" type="checkbox" role="switch" checked>
					Show experimental versions changelogs
				</label>
			</fieldset>
		</section>
		<section id="changelogContainer">
		</section>
		<script>
			fetchChangelogs().then(result => {
				let html = ""
				// TODO: sort by date or by tag
				// flatChangelogs.sort((x, y) => {
				// 	let cmp = y.date - x.date;
				// 	return (cmp) ? cmp : semver.compareBuild(y.tag, x.tag)
				// });
				for (const changelog of result.flatChangelogs.reverse()) {
					html += buildChangelog(changelog);
				}
				document.getElementById("changelogContainer").innerHTML += html;
				if (location.hash) {
					document.getElementById(location.hash.replace("#", ""))
						.scrollIntoView();
				}
			});
		</script>
	</main>
</body>

</html>
